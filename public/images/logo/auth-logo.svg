<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">INSIGHTS logo, dark theme</title>
  <desc id="desc">A large rounded square badge with a green gradient containing a dark upward trend line ending in a dot, next to the large wordmark INSIGHTS in light green, and the tagline ALLAMA IQBAL OPEN UNIVERSITY in light gray, for use on dark backgrounds.</desc>
  <defs>
    <linearGradient id="badgeGradientDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43a047"/>
      <stop offset="1" stop-color="#81c784"/>
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="266" height="266" rx="59" fill="url(#badgeGradientDark)"/>
  <polyline points="67,216 120,162 168,185 221,73" fill="none" stroke="#0b1a0e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="221" cy="73" r="18" fill="#0b1a0e"/>

  <text x="308" y="182" font-family="Arial, Helvetica, sans-serif" font-size="101" font-weight="400">
    <tspan fill="#81c784">INSIGHTS</tspan>
  </text>
  <text x="308" y="252" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#c1c9d1">ALLAMA IQBAL OPEN UNIVERSITY</text>
</svg>
