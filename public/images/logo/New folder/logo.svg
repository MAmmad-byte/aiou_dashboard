<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">AIOU Dashboard logo</title>
  <desc id="desc">A large rounded square badge with a green gradient containing a white upward trend line ending in a dot, next to the large wordmark AIOU Dashboard and the tagline Analytics dashboard.</desc>
  <defs>
    <linearGradient id="badgeGradientLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#66bb6a"/>
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="266" height="266" rx="59" fill="url(#badgeGradientLight)"/>
  <polyline points="67,216 120,162 168,185 221,73" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="221" cy="73" r="18" fill="#ffffff"/>

  <text x="308" y="182" font-family="Arial, Helvetica, sans-serif" font-size="101" font-weight="400">
    <tspan fill="#1b5e20">AIOU</tspan><tspan fill="#111827"> Dashboard</tspan>
  </text>
  <text x="308" y="252" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#4b5563">Analytics dashboard</text>
</svg>
